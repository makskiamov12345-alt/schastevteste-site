<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СчастьеВТесте — Семейная пиццерия</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    
    <style>
        /* --- WARM & COZY VARIABLES --- */
        :root {
            --primary: #FF5252;
            --primary-hover: #FF7675;     
            --accent: #FFD166;
            --bg-color: #FFFDF5;
            --card-bg: #FFFFFF;
            --text-main: #4A4A4A;
            --text-light: #8D8D8D;
            --font-main: 'Nunito', sans-serif;
            --font-hand: 'Pacifico', cursive;
            
            --shadow-cozy: 0 8px 20px rgba(255, 82, 82, 0.08);
            --shadow-float: 0 15px 30px rgba(255, 165, 2, 0.15);
            --radius: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: radial-gradient(#FFD166 1px, transparent 1px);
            background-size: 40px 40px;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }
        img { max-width: 100%; display: block; object-fit: cover; }
        button { font-family: var(--font-main); cursor: pointer; border: none; outline: none; }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.1); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
            60% { transform: scale(1); }
        }

        @keyframes slideInUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* --- HEADER --- */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 15px 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(219, 186, 142, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent);
            border-radius: 0 0 20px 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .logo-img {
            height: 60px;
            width: auto;
            transition: transform 0.3s;
        }
        .logo-container:hover .logo-img {
            animation: heartbeat 1.5s infinite;
        }

        .logo-text {
            font-family: var(--font-hand);
            font-size: 1.5rem;
            color: var(--text-main);
            line-height: 1;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .phone-link {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
            display: none;
        }
        @media(min-width: 768px) { .phone-link { display: block; } }

        .btn-chat-small {
            background: var(--accent);
            color: var(--text-main);
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.95rem;
            border: 2px solid white;
            box-shadow: 0 4px 10px rgba(255, 209, 102, 0.4);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .btn-chat-small:hover { 
            transform: scale(1.05) rotate(2deg); 
            background: #FFDD85;
        }

        /* --- HERO --- */
        .hero {
            text-align: center;
            padding: 120px 20px 80px;
            background: linear-gradient(rgba(255, 126, 95, 0.6), rgba(254, 180, 123, 0.6)), 
                        url('images/zastavka.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            position: relative;
            border-radius: 0 0 50px 50px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .hero h1 {
            font-family: var(--font-hand);
            font-size: 3rem;
            margin-bottom: 15px;
            text-shadow: 2px 4px 0px rgba(0,0,0,0.2);
            animation: float 6s ease-in-out infinite;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 35px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary);
            display: inline-block;
            padding: 10px 25px;
            border-radius: 50px;
            transform: rotate(-1deg);
        }

        .btn-main {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            border: 4px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 20px rgba(255, 82, 82, 0.4);
            transition: all 0.3s;
        }
        .btn-main:hover {
            transform: translateY(-5px) scale(1.05);
            background: var(--primary-hover);
        }

        /* --- MENU --- */
        .section-title {
            text-align: center;
            color: var(--text-main);
            font-family: var(--font-hand);
            font-weight: 400;
            font-size: 2.8rem;
            margin: 60px 0 20px;
            text-shadow: 2px 2px 0px #fff;
        }
        
        .menu-category-title {
            grid-column: 1 / -1;
            font-family: var(--font-main);
            font-weight: 800;
            color: var(--primary);
            font-size: 1.8rem;
            margin: 50px 0 30px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .menu-category-title::before, .menu-category-title::after {
            content: ''; display: block; width: 50px; height: 4px; background: var(--accent); border-radius: 10px;
        }

        .menu-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 35px;
            align-items: start;
        }

        /* CARD STYLES */
        .pizza-item {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-cozy);
            overflow: hidden;
            transition: all 0.4s ease;
            border: 2px solid transparent;
        }
        .pizza-item:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-float);
            border-color: var(--accent);
        }

        details > summary { list-style: none; cursor: pointer; outline: none; }
        details > summary::-webkit-details-marker { display: none; }

        .card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 0 0 20px 20px;
            margin-bottom: -20px;
            position: relative;
            z-index: 1;
        }

        .card-body-preview {
            padding: 30px 20px 10px;
            position: relative;
            z-index: 2;
            background: var(--card-bg);
            border-radius: 20px 20px 0 0;
        }

            font
