<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СчастьеВТесте — Семейная пиццерия</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    
    <style>
        /* --- VARIABLES --- */
        :root {
            --primary: #FF5252;
            --accent: #FFD166;
            --bg-color: #FFFDF5;
            --text-main: #4A4A4A;
            --radius: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background-color: var(--bg-color); color: var(--text-main); }
        button { cursor: pointer; border: none; outline: none; font-family: inherit; }
        img { max-width: 100%; display: block; object-fit: cover; }

        /* --- HEADER & HERO --- */
        header {
            background: rgba(255,255,255,0.95); padding: 15px 5%; position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); border-bottom: 3px solid var(--accent);
        }
        .logo-text { font-family: 'Pacifico', cursive; font-size: 1.5rem; line-height: 1; }
        
        .hero {
            text-align: center; padding: 100px 20px;
            background: linear-gradient(rgba(255,126,95,0.6), rgba(254,180,123,0.6)), url('images/zastavka.jpg') center/cover;
            color: white; border-radius: 0 0 50px 50px;
        }
        .hero h1 { font-family: 'Pacifico', cursive; font-size: 2.5rem; text-shadow: 2px 2px 0 rgba(0,0,0,0.2); }

        /* --- MENU --- */
        .menu-container {
            max-width: 1200px; margin: 0 auto; padding: 40px 20px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px;
        }
        .section-title { text-align: center; font-family: 'Pacifico', cursive; font-size: 2.5rem; margin-bottom: 30px; }
        
        .pizza-item {
            background: white; border-radius: var(--radius); overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05); transition: 0.3s;
        }
        .pizza-item:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        
        .card-img { height: 200px; width: 100%; }
        .card-body { padding: 20px; }
        .card-title { font-weight: 800; font-size: 1.2rem; display: flex; justify-content: space-between; margin-bottom: 10px; }
        .price-tag { background: #eee; padding: 2px 10px; border-radius: 20px; font-size: 0.9rem; }
        
        .extra-option {
            background: #f9f9f9; padding: 10px; border-radius: 10px; margin: 15px 0;
            display: flex; align-items: center; gap: 10px; font-size: 0.9rem; cursor: pointer;
        }
        .extra-option:hover { background: #FFF9E5; }

        .btn-add {
            background: var(--text-main); color: white; width: 100%; padding: 12px;
            border-radius: 15px; font-weight: 700; transition: 0.2s;
        }
        .btn-add:hover { background: var(--primary); transform: scale(1.02); }

        /* --- FLOATING CHAT --- */
        .chat-widget {
            position: fixed; bottom: 30px; right: 30px; z-index: 1000;
            display: flex; flex-direction: column; align-items: flex-end;
        }
        
        .chat-btn {
            width: 60px; height: 60px; background: var(--primary); color: white;
            border-radius: 50%; font-size: 30px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(255,82,82,0.4); transition: 0.3s;
        }
        .chat-btn:hover { transform: scale(1.1) rotate(10deg); }
        
        .chat-window {
            width: 350px; height: 500px; background: white; border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); margin-bottom: 20px;
            display: none; flex-direction: column; overflow: hidden; border: 4px solid var(--accent);
        }
        .chat-window.active { display: flex; }

        .chat-header { background: var(--accent); padding: 15px; display: flex; align-items: center; gap: 10px; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: #fafafa; }
        
        .message { 
            background: white; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 0.95rem; max-width: 90%;
        }
        .msg-bot { border-bottom-left-radius: 2px; }
        .msg-user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 2px; margin-left: auto; }

        /* --- CART MODAL (NEW) --- */
        .cart-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 10; display: none; flex-direction: column;
        }
        .cart-modal.open { display: flex; }
        
        .cart-header { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 1.1rem; }
        .close-cart { font-size: 1.5rem; padding: 0 10px; color: #999; }
        
        .cart-items { flex: 1; overflow-y: auto; padding: 15px; }
        
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border: 1px solid #eee; border-radius: 12px; margin-bottom: 10px;
        }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-weight: 700; font-size: 0.9rem; }
        .cart-item-price { color: #888; font-size: 0.85rem; }
        
        .cart-controls { display: flex; align-items: center; gap: 10px; margin-left: 10px; }
        .cart-btn-mini {
            width: 25px; height: 25px; background: #eee; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: 800;
        }
        
        .cart-footer { padding: 15px; border-top: 1px solid #eee; background: #fafafa; }
        .cart-total { display: flex; justify-content: space-between; font-weight: 800; font-size: 1.2rem; margin-bottom: 15px; }
        .btn-checkout { width: 100%; background: var(--primary); color: white; padding: 15px; border-radius: 15px; font-weight: 700; font-size: 1rem; }

        .chat-input-area { padding: 10px; border-top: 1px solid #eee; display: flex; gap: 5px; }
        .chat-input-area button { background: var(--accent); width: 40px; height: 40px; border-radius: 50%; }
        #chatInput { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 0 15px; }

        @media(max-width:480px) {
            .chat-window { width: 90vw; height: 70vh; position: fixed; bottom: 90px; right: 5vw; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">Счастье<br><span style="color:var(--primary)">ВТесте</span></div>
        <button class="btn-chat-small" onclick="toggleChat()">👋 Чат</button>
    </header>

    <section class="hero">
        <h1>Вкусно, как у мамы!</h1>
        <button class="btn-add" style="width: auto; padding: 15px 40px; margin-top: 20px;" onclick="document.getElementById('menu').scrollIntoView()">К меню</button>
    </section>

    <section id="menu">
        <h2 class="section-title">Меню</h2>
        <div class="menu-container">

            <article class="pizza-item">
                <img src="images/margarita.jpg" class="card-img" alt="Маргарита">
                <div class="card-body">
                    <div class="card-title">Маргарита <span class="price-tag">490 ₽</span></div>
                    <p class="ingredients">Томатный соус, моцарелла, базилик.</p>
                    
                    <label class="extra-option">
                        <input type="checkbox" onchange="toggleOption(this, 150)"> 🧀 Сырный бортик (+150₽)
                    </label>
                    
                    <button class="btn-add" onclick="addItem(this, 'Маргарита', 490)">В корзину</button>
                </div>
            </article>

            <article class="pizza-item">
                <img src="images/peperony.jpg" class="card-img" alt="Пеперони">
                <div class="card-body">
                    <div class="card-title">Пеперони <span class="price-tag">690 ₽</span></div>
                    <p class="ingredients">Пикантная пеперони, моцарелла, соус.</p>
                    
                    <label class="extra-option">
                        <input type="checkbox" onchange="toggleOption(this, 150)"> 🧀 Сырный бортик (+150₽)
                    </label>
                    
                    <button class="btn-add" onclick="addItem(this, 'Пеперони', 690)">В корзину</button>
                </div>
            </article>

            </div>
    </section>

    <div class="chat-widget">
        <div class="chat-window" id="chatWindow">
            
            <div id="chatScreen" style="display: flex; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div style="background:white; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center;">👨‍🍳</div>
                    <div><b>Тестяшка</b><br><small>Онлайн</small></div>
                    <button onclick="openCart()" style="margin-left: auto; background: white; padding: 5px 10px; border-radius: 15px; font-weight:700;">🛒 <span id="cartCount">0</span></button>
                </div>
                <div class="chat-messages" id="chatBody"></div>
                <div class="chat-input-area" id="inputArea">
                    <input type="text" id="chatInput" placeholder="Напишите сообщение...">
                    <button onclick="handleUserSend()">➤</button>
                </div>
            </div>

            <div class="cart-modal" id="cartModal">
                <div class="cart-header">
                    Ваш заказ
                    <span class="close-cart" onclick="closeCart()">×</span>
                </div>
                <div class="cart-items" id="cartList">
                    </div>
                <div class="cart-footer">
                    <div class="cart-total">
                        <span>Итого:</span>
                        <span id="cartTotalDisplay">0 ₽</span>
                    </div>
                    <button class="btn-checkout" onclick="startCheckout()">Оформить заказ</button>
                </div>
            </div>

        </div>
        <button class="chat-btn" onclick="toggleChat()">💬</button>
    </div>

    <script>
        // DATA
        let cart = [];
        let orderStep = 0; // 0=Idle, 1=Address, 2=Phone
        const MAKE_WEBHOOK = 'https://hook.make.com/YOUR_WEBHOOK_HERE'; // Вставьте сюда

        // DOM
        const chatWindow = document.getElementById('chatWindow');
        const chatBody = document.getElementById('chatBody');
        const cartModal = document.getElementById('cartModal');
        const cartList = document.getElementById('cartList');
        const countSpan = document.getElementById('cartCount');
        const totalSpan = document.getElementById('cartTotalDisplay');

        // --- CORE FUNCTIONS ---

        function toggleChat() {
            chatWindow.classList.toggle('active');
            if(chatWindow.classList.contains('active') && chatBody.children.length === 0) {
                botSay("Привет! 👋 Добавляй пиццу в корзину (кнопки в меню), а здесь мы оформим заказ.");
            }
        }

        function botSay(text) {
            chatBody.innerHTML += `<div class="message msg-bot">${text}</div>`;
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function userSay(text) {
            chatBody.innerHTML += `<div class="message msg-user">${text}</div>`;
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // --- MENU LOGIC ---

        function toggleOption(checkbox, cost) {
            // Просто визуально (логика в addItem)
        }

        function addItem(btn, name, basePrice) {
            const card = btn.closest('.card-body');
            const checkbox = card.querySelector('input[type="checkbox"]');
            
            let finalName = name;
            let finalPrice = basePrice;

            if(checkbox && checkbox.checked) {
                finalName += " (🧀 борт)";
                finalPrice += 150;
            }

            // Check if exists
            const existing = cart.find(i => i.name === finalName);
            if(existing) {
                existing.qty++;
            } else {
                cart.push({ name: finalName, price: finalPrice, qty: 1 });
            }

            updateCartUI();
            
            // Animation effect
            btn.innerText = "Добавлено! ✔";
            setTimeout(() => btn.innerText = "В корзину", 1000);
            
            if(!chatWindow.classList.contains('active')) toggleChat();
            
            // Notification in chat ONLY if it's the first item or user closed modal
            if(cartModal.style.display !== 'flex') {
                // botSay(`Добавил <b>${finalName}</b>. В корзине: ${cart.reduce((a,b)=>a+b.qty,0)} шт.`);
            }
        }

        // --- CART LOGIC ---

        function updateCartUI() {
            cartList.innerHTML = "";
            let total = 0;
            let totalQty = 0;

            if(cart.length === 0) {
                cartList.innerHTML = "<div style='text-align:center; color:#999; margin-top:50px;'>Корзина пуста 🕸️</div>";
            }

            cart.forEach((item, index) => {
                total += item.price * item.qty;
                totalQty += item.qty;

                cartList.innerHTML += `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-price">${item.price} ₽</div>
                    </div>
                    <div class="cart-controls">
                        <button class="cart-btn-mini" onclick="changeQty(${index}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="cart-btn-mini" onclick="changeQty(${index}, 1)">+</button>
                    </div>
                </div>`;
            });

            countSpan.innerText = totalQty;
            totalSpan.innerText = total + " ₽";
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if(cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        function openCart() {
            cartModal.classList.add('open');
            updateCartUI();
        }

        function closeCart() {
            cartModal.classList.remove('open');
        }

        // --- CHECKOUT LOGIC ---

        function startCheckout() {
            if(cart.length === 0) return;
            closeCart();
            orderStep = 1;
            botSay("Отличный выбор! 😋 Куда доставить заказ? (Напишите адрес)");
        }

        async function handleUserSend() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if(!text) return;
            
            userSay(text);
            input.value = '';

            if(orderStep === 1) {
                window.address = text;
                orderStep = 2;
                setTimeout(() => botSay("Записал. Теперь номер телефона для связи:"), 500);
            } else if (orderStep === 2) {
                window.phone = text;
                orderStep = 0; // Reset
                botSay("⏳ Отправляю заказ на кухню...");
                
                // SEND TO MAKE
                const payload = {
                    cart: cart,
                    address: window.address,
                    phone: window.phone,
                    total: parseInt(totalSpan.innerText)
                };

                try {
                    // Раскомментируйте, когда вставите ссылку
                    // await fetch(MAKE_WEBHOOK, { method: 'POST', body: JSON.stringify(payload) });
                    
                    setTimeout(() => {
                        botSay(`✅ <b>Заказ принят!</b><br>Сумма: ${payload.total} ₽<br>Ждите звонка!`);
                        cart = [];
                        updateCartUI();
                    }, 1000);
                } catch(e) {
                    botSay("Ошибка связи. Позвоните нам!");
                }
            } else {
                // Chatting mode
                setTimeout(() => botSay("Я понимаю только команды заказа. Добавьте пиццу в меню и нажмите корзину!"), 500);
            }
        }
    </script>
</body>
</html>
